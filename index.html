<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ketako</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*(margin:0;padding:0;box-sizing:border-box)
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh; }
.logo { background:#e85d04; color:#fff; width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
header { padding:12px 16px; border-bottom:1px solid #222; display:flex; align-items:center; gap:12px; }
header div { display:flex; flex-direction:column; }
h1 { font-size:18px; font-weight:600; }
h1 span { color:#e85d04; }
.sub { font-size:12px; color:#888; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:16px; line-height:1.5; font-size:15px; }
.user { background:#e85d04; align-self:flex-end; border-bottom-right-radius:4px; }
.bot { background:#1a1a1a; align-self:flex-start; border-bottom-left-radius:4px; color:#eee; }
.bot ul,.bot ol { margin-left:18px; }
.bot strong { color:#e85d04; }
.bot a { color:#e85d04; }
footer { padding:12px 16px; border-top:1px solid #222; background:#0a0a0a; }
.input-row { display:flex; gap:8px; align-items:center; }
#micbtn { background:#1a1a1a; color:#e85d04; border:2px solid #e85d04; padding:10px 14px; border-radius:12px; cursor:pointer; font-size:20px; transition:all 0.2s; flex-shrink:0; }
#micbtn.on { background:#e85d04; color:#fff; animation:pulse 1s infinite; }
#micbtn.recording { background:#e85d04; color:#fff; }
@keyframes pulse { 0%{opacity:1}50%{opacity:0.6}100%{opacity:1} }
input { flex:1; background:#1a1a1a; border:1px solid #333; color:#fff; padding:12px 16px; border-radius:12px; font-size:15px; outline:none; }
input:focus { border-color:#e85d04; }
#sendbtn { background:#e85d04; color:#fff; border:none; padding:12px 18px; border-radius:12px; cursor:pointer; font-size:18px; flex-shrink:0; }
button:disabled { opacity:0.5; cursor:not-allowed; }
#status { font-size:11px; color:#e85d04; text-align:center; margin-top:6px; min-height:16px; }
</style>
</head>
<body>
<header>
  <div class="logo">K</div>
  <div>
    <h1>Ke<span>tako</span></h1>
    <div class="sub">Gipuzkoako laguntzailea</div>
  </div>
</header>
<div id="chat"></div>
<footer>
  <div class="input-row">
    <button id="micbtn" onclick="toggleMic()" title="Hitz egin">🎤</button>
    <input id="inp" placeholder="Galdetu..." onkeydown="if(event.key==='Enter')send()">
    <button id="sendbtn" onclick="send()">&#10148;</button>
  </div>
  <div id="status"></div>
</footer>
<script>
// ── Detección de capacidades ──
const hasWebSpeech = ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window);
const hasMediaRecorder = ('MediaRecorder' in window);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

let rec = null, going = false;
let mediaRec = null, audioChunks = [];

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ── Toggle micrófono: elige método según dispositivo ──
function toggleMic() {
  if (isIOS || !hasWebSpeech) {
    toggleMediaRecorder();
  } else {
    toggleWebSpeech();
  }
}

// ── Método 1: WebSpeechRecognition (Chrome, Android) ──
function toggleWebSpeech() {
  if (going) { rec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang = 'eu-ES';
  rec.interimResults = false;
  rec.onstart = () => { going = true; document.getElementById('micbtn').classList.add('on'); setStatus('Entzuten...'); };
  rec.onresult = (e) => { document.getElementById('inp').value = e.results[0][0].transcript; send(); };
  rec.onerror = rec.onend = () => { going = false; document.getElementById('micbtn').classList.remove('on'); setStatus(''); };
  rec.start();
}

// ── Método 2: MediaRecorder + Whisper (iOS Safari, otros) ──
async function toggleMediaRecorder() {
  if (going) {
    mediaRec.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRec.onstop = async () => {
      going = false;
      document.getElementById('micbtn').classList.remove('recording');
      setStatus('Prozesatzen...');
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await transcribeAudio(blob);
    };
    mediaRec.start();
    going = true;
    document.getElementById('micbtn').classList.add('recording');
    setStatus('Grabatzen... Berriz sakatu gelditzeko');
  } catch(e) {
    setStatus('Mikrofonoa baimendu behar duzu');
  }
}

// ── Transcripción via Whisper (Anthropic API) ──
async function transcribeAudio(blob) {
  try {
    // Convertir blob a base64
    const arrayBuffer = await blob.arrayBuffer();
    const uint8Array = new Uint8Array(arrayBuffer);
    let binary = '';
    uint8Array.forEach(b => binary += String.fromCharCode(b));
    const base64 = btoa(binary);

    const response = await fetch('/api/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio: base64, mimeType: blob.type })
    });
    const data = await response.json();
    if (data.text) {
      document.getElementById('inp').value = data.text;
      setStatus('');
      send();
    } else {
      setStatus('Ez da ulertu, saiatu berriro');
    }
  } catch(e) {
    setStatus('Errorea: ' + e.message);
  }
}

// ── Enviar mensaje ──
async function send() {
  const i = document.getElementById('inp');
  const b = document.getElementById('sendbtn');
  const c = document.getElementById('chat');
  const t = i.value.trim();
  if (!t) return;
  i.value = '';
  b.disabled = true;
  setStatus('');
  c.innerHTML += '<div class="msg user">' + t + '</div>';
  const l = document.createElement('div');
  l.className = 'msg bot';
  l.textContent = '...';
  c.appendChild(l);
  c.scrollTop = c.scrollHeight;
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: t})});
    const d = await r.json();
    const reply = d.reply || d.error || 'Error';
    l.innerHTML = marked.parse(reply);
    // Voz de salida (opcional, si el navegador lo soporta)
    speakReply(reply);
  } catch(e) {
    l.textContent = 'Error: ' + e.message;
  }
  c.scrollTop = c.scrollHeight;
  b.disabled = false;
  document.getElementById('inp').focus();
}

// ── Voz de salida ──
function speakReply(text) {
  if (!('speechSynthesis' in window)) return;
  // Solo habla si el texto es corto (respuesta directa, no programa largo)
  const plain = text.replace(/[#*\[\]()]/g, '').replace(/https?:\/\/\S+/g, '').trim();
  if (plain.length > 300) return; // respuestas largas no se leen
  const u = new SpeechSynthesisUtterance(plain);
  // Detectar idioma: si tiene palabras vascas comunes
  const euWords = ['eus', 'eta', 'dago', 'dira', 'bai', 'ez', 'zer', 'non', 'noiz', 'nola'];
  const isEu = euWords.some(w => plain.toLowerCase().includes(w));
  u.lang = isEu ? 'eu-ES' : 'es-ES';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
</script>
</body>
</html>
